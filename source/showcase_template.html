<title>Dino's Big Adventure</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#bfe3f5; --panel:#f8fbff; --panel2:#dcecf8; --ink:#13203d; --muted:#46567a; --line:#13203d;
  --sky:#9fd6f2; --grass:#62c254; --grass2:#52ad46; --track:#d8572a;
  --font-display:'Press Start 2P','DotGothic16','Noto Sans TC',monospace;
  --font-body:'DotGothic16','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0c1730;--panel:#14284a;--panel2:#1d3764;--ink:#e9f2ff;--muted:#9db3d6;--line:#030a18;--sky:#16305e;--grass:#2f7d3d;--grass2:#286b34;--track:#c4572f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1730;--panel:#14284a;--panel2:#1d3764;--ink:#e9f2ff;--muted:#9db3d6;--line:#030a18;--sky:#16305e;--grass:#2f7d3d;--grass2:#286b34;--track:#c4572f;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;padding:20px max(16px,env(safe-area-inset-right,0px)) 36px max(16px,env(safe-area-inset-left,0px))}
h1,h2,p{margin:0}
.card{max-width:440px;margin:0 auto;background:var(--panel);border:3px solid var(--line);box-shadow:5px 5px 0 var(--line)}
.hd{padding:14px 16px 10px}
.kick{font-family:var(--font-display);font-size:9px;letter-spacing:.08em;color:var(--muted)}
.hd h1{font-family:var(--font-display);font-size:clamp(20px,6.4vw,28px);line-height:1.3}
.hd .dt{margin-top:4px;color:var(--muted);font-size:13px}
.scene svg{display:block;width:100%;height:auto;border-block:3px solid var(--line)}
.m-sky{fill:var(--sky)}.m-grass{fill:var(--grass)}.m-grass2{fill:var(--grass2)}.m-track{stroke:var(--track)}.m-trunk{fill:#7a4a2a}.m-leaf2{fill:#2f7d3d}
.sec{padding:12px 16px;border-top:2px dashed var(--line)}
.sec:first-of-type{border-top:0}
.sec h2{font-family:var(--font-display);font-size:11px;margin-bottom:8px}
.wk{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kd{display:inline-block;min-width:2em;text-align:center;border:2px solid var(--line);background:var(--panel2);font-family:var(--font-display);font-size:13px;padding:4px 6px}
.wt{overflow-wrap:anywhere;font-size:16px}
.meta{color:var(--muted);font-size:13px;margin-top:6px}
.st{display:inline-block;border:2px solid var(--line);padding:0 8px;font-size:13px;margin-top:8px}
.st.done{background:#62c254;color:#0b2b10}.st.todo{background:#fff;color:#13203d;border-style:dashed}
.pips{display:flex;gap:4px;margin-top:6px}.pips i{width:22px;height:14px;border:2px solid var(--line);background:#fff;display:block}.pips i.on{background:#62c254}
.big{font-size:20px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--panel2);padding:6px 8px;font-size:13px}
.chip i{flex:none;width:18px;height:18px;border:2px solid var(--line);display:block}
.chip.ok i{background:#4cc23f}.chip.out i{background:#ee3b3b}.chip.near i{background:#f2c230}.chip.missing i{background:#fff}
.legend{margin-top:8px;color:var(--muted);font-size:12px}
.ft{padding:10px 16px;border-top:3px solid var(--line);color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
@keyframes sweat{0%{transform:translateY(0);opacity:1}75%{transform:translateY(8px);opacity:1}100%{transform:translateY(12px);opacity:0}}
.sdrop{animation:sweat .9s steps(5,end) infinite}
@keyframes rf4{0%{opacity:1}25%,100%{opacity:0}}
@keyframes rf2{0%{opacity:1}50%,100%{opacity:0}}
.rf{opacity:0}
@media (prefers-reduced-motion:reduce){.sdrop{animation:none!important}.rf{animation:none!important;opacity:0!important}.rf[data-s]{opacity:1!important}}
</style>
<main class="card" id="card" aria-label="今天做了什麼"></main>
<script>
(function(){
var SNAP=__SNAP__;
__SPRITE__
var WD=['日','一','二','三','四','五','六'];
/* 終點拱門（橫跨跑道，三種風格：gold 金色典禮門／festival 彩旗慶典門／royal 皇家紅毯門）。
   近側柱在跑道前方、遠側柱在跑道後方，斜橫樑連接兩柱頂，中間吊名牌，地面有終點線。
   回傳 {r:[[x,y,w,h,色]...], t:{x,y,w,c}}；t 是名牌上文字的位置與顏色。
   baseN／baseF＝近側／遠側柱腳的 y，ah＝柱高，dx＝遠側柱往右的位移，bw＝名牌寬，tb＝跑道下緣的 y */
function archParts(x0,baseN,baseF,ah,dx,bw,tb,style){
  var S={
    gold:{PF:'#f6d65a',PS:'#c9971f',PT:'#fff3b0',bA:'#f2c230',bB:'#ffffff',pl:'#ffe27a',plO:'#9a6b00',tx:'#13203d',g1:'#ffffff',g2:'#13203d'},
    festival:{PF:'#ffffff',PS:'#c9d3e6',PT:'#2f6fdd',bA:'#ffffff',bB:'#13203d',pl:'#ffffff',plO:'#e8453c',tx:'#13203d',g1:'#ffffff',g2:'#13203d'},
    royal:{PF:'#b9bfcc',PS:'#8b93a5',PT:'#d9deea',bA:'#b82e2e',bB:'#f2c230',pl:'#13203d',plO:'#f2c230',tx:'#ffffff',g1:'#b82e2e',g2:'#8f1f1f'}
  }[style||'gold']||{};
  var O='#13203d',pw=6,bh=11,R=[],y,i,t;
  function leg(x,base){
    var y0=base-ah, k;
    R.push([x+1,base,pw+2,2,'#7ea05a']);                                       // 地面影子
    R.push([x,y0,pw,ah,S.PF],[x+pw,y0,2,ah,S.PS]);                             // 正面、側面
    R.push([x,y0-2,pw+2,2,S.PT]);                                              // 頂蓋
    if(style==='festival'){ for(k=0;k<ah-6;k+=8) R.push([x+1,y0+3+k,pw-1,3,'#e8453c']); }          // 紅白條紋柱
    if(style==='royal'){ for(k=5;k<ah-3;k+=6) R.push([x+1,y0+k,pw-1,1,S.PS]); }                    // 磚縫
    R.push([x,y0,1,ah,O],[x+pw+1,y0,1,ah,O],[x,base-1,pw+2,1,O],[x,y0-2,pw+2,1,O]);                // 外框
    if(style==='gold'){                                                                              // 基座、金球、旗幟
      R.push([x-1,base-4,pw+4,4,S.PS],[x-1,base-4,pw+4,1,O],[x-1,base-1,pw+4,1,O]);
      R.push([x+1,y0-8,4,5,S.PT],[x+3,y0-8,2,5,S.PS],[x+1,y0-8,4,1,O],[x+1,y0-4,4,1,O]);
      R.push([x+3,y0-14,1,6,O],[x+4,y0-14,6,3,'#e8453c'],[x+4,y0-11,4,1,'#b82e2e']);
    }
    if(style==='festival'){ R.push([x+2,y0-6,2,4,O],[x+1,y0-8,4,2,'#e8453c']); }                      // 頂端小燈
    if(style==='royal'){                                                                             // 火炬
      R.push([x,y0-6,pw+2,4,'#5b4a2e'],[x,y0-6,pw+2,1,O]);
      R.push([x+1,y0-12,4,6,'#ff9f1c'],[x+2,y0-15,2,4,'#ffd23f'],[x+2,y0-10,2,3,'#ffd23f']);
    }
  }
  // 地面終點線：沿兩柱腳之間斜著橫過跑道，格紋（皇家版為紅毯）
  for(y=baseF;y<=tb;y++){
    var xl=x0+dx-Math.round(dx*(y-baseF)/Math.max(1,baseN-baseF)), c=Math.floor((y-baseF)/3)%2;
    R.push([xl-1,y,4,1,c?S.g1:S.g2],[xl+3,y,4,1,c?S.g2:S.g1]);
  }
  leg(x0+dx,baseF);                                                          // 遠側柱（先畫）
  var yf=baseF-ah-2, yn=baseN-ah-2, th=7;                                    // 橫樑：由遠柱頂斜到近柱頂，加厚成橫幅帶（th 列厚）
  function bxAt(yy){ return x0+dx-Math.round(dx*(yy-yf)/Math.max(1,yn-yf)); }
  for(y=yf;y<=yn;y++){ for(i=-1;i<=th;i++) R.push([bxAt(y)-1,y+i,pw+4,1,O]); }   // 先畫深色外框
  for(y=yf;y<=yn;y++){                                                       // 再填色
    var k2=Math.floor((y-yf)/3)%2, col=style==='royal'?((y-yf)%6===0?S.bB:S.bA):(k2?S.bB:S.bA);
    for(i=0;i<th;i++) R.push([bxAt(y),y+i,pw+2,1,col]);
  }
  if(style==='festival'){                                                    // 彩旗串，掛在橫樑下
    var cs=['#e8453c','#f2c230','#2f6fdd','#62c254'], n=0;
    for(y=yf+4;y<=yn;y+=5){ var fx=bxAt(y)-1, fc=cs[n++%4]; R.push([fx,y+th+1,8,2,fc],[fx+1,y+th+3,6,2,fc],[fx+2,y+th+5,4,2,fc]); }
  }
  if(style==='royal'){                                                       // 紅布垂簾
    for(y=yf+2;y<=yn;y+=4){ var rx=bxAt(y); R.push([rx+1,y+th+1,pw,3,'#8f1f1f'],[rx+2,y+th+4,pw-2,1,'#8f1f1f']); }
  }
  leg(x0,baseN);                                                             // 近側柱（後畫，擋在橫樑前）
  var mx=x0+Math.round(dx/2)+4, my=Math.round((yf+yn)/2)+th+3;             // 名牌
  R.push([mx-bw/2+3,my-3,1,3,O],[mx+bw/2-4,my-3,1,3,O]);                     // 吊繩
  R.push([mx-bw/2-1,my-1,bw+2,bh+2,O],[mx-bw/2,my,bw,bh,S.plO],[mx-bw/2+1,my+1,bw-2,bh-2,S.pl]);
  return {r:R,t:{x:mx,y:my+bh-3,w:bw-4,c:S.tx}};
}
/* 終點拱門的出現規則與風格（前端；依賴 wlabel）。
   - 比賽當天：拱門隨機用金色（gold）或皇家紅毯（royal），名牌寫賽事名稱
   - 品質課表（標記為關鍵課表，或名稱含節奏、間歇、閾值、乳酸、CP、配速、tempo、interval、VO2）：彩旗慶典門（festival），名牌寫課表短標籤
   - 其他（一般課表）：沒有拱門，維持原本畫面
   force：預覽用，強制指定風格 */
function isQuality(w){ return !!w && (w.key===true || /節奏|間歇|閾值|乳酸|CP|配速|tempo|interval|VO2/i.test(String(w.title||''))); }
function raceLabel(name){ return String(name||'').replace(/人壽|馬拉松|\s/g,''); }
function archPlan(nx,race,today,force){
  var st=null,label=null;
  if(race&&race.date===today){ st=Math.random()<0.5?'gold':'royal'; label=raceLabel(race.name); }
  else if(nx&&isQuality(nx)){ st='festival'; label=wlabel(nx.title,nx.kind); }
  if(force==='gold'||force==='festival'||force==='royal'){ if(!st) label=nx?wlabel(nx.title,nx.kind):'終點'; st=force; }
  return st?{style:st,label:label}:null;
}
function archLabel(s,maxChars){s=String(s||'');return s.length>maxChars?s.slice(0,maxChars-1)+'…':s}
/* 課表原名 → 短標籤（前端顯示用；資料本身不改）。
   「南山銳1_WED_跑步Z2」→「Z2」、「南山銳1_MON_騎車恢復」→「輕鬆騎」、「南山銳2_THU_節奏跑」→「節奏跑」。
   名稱不是「計畫_星期_內容」格式（例如活動名稱含地名）時，只顯示類型。 */
function wlabel(title,kind){
  var K={'跑':'跑步','騎':'騎車','游':'游泳','肌力':'肌力訓練'}, C={'跑':'跑','騎':'騎','游':'游'};
  var parts=String(title||'').split('_');
  if(parts.length<3) return K[kind]||kind||'其他';
  var s=parts.slice(2).join('_').replace(/恢復/g,'輕鬆').replace(/跑步|騎車|游泳/g,'').trim();
  if(!s) return K[kind]||kind||'其他';
  if(s==='輕鬆') return '輕鬆'+(C[kind]||'');
  return s;
}
var KN={'跑':'跑步','騎':'騎車','游':'游泳','肌力':'肌力訓練'}; function kn(k){return KN[k]||k||'其他'}
function p(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var d=p(SNAP.date), days=Math.round((p(SNAP.race.date)-d)/86400000);
var w=SNAP.workout, act=w?(KIND2ACT[w.kind]||'idle'):'idle';
var ACTN={run:'跑步',bike:'騎車',swim:'游泳',idle:'休息'};
var LBL={ok:'在範圍內',near:'接近邊界',out:'超出範圍',missing:'今天還沒資料'};
var sweat=0; ['rhr','hrv'].forEach(function(k){var s=SNAP.body[k];if(s==='out')sweat=3;else if(s==='near'&&sweat<1)sweat=1});
function scene(){
  var AR=archPlan(SNAP.next,SNAP.race,SNAP.date,(location.hash.match(/arch=(\w+)/)||[])[1]);
  var s='<svg viewBox="0 0 220 130" role="img" aria-label="角色正在'+ACTN[act]+'" shape-rendering="crispEdges">';
  s+='<rect class="m-sky" x="0" y="0" width="220" height="40"/><rect class="m-grass" x="0" y="40" width="220" height="90"/>';
  for(var y=50;y<130;y+=24) s+='<rect class="m-grass2" x="0" y="'+y+'" width="220" height="10"/>';
  s+='<rect class="m-trunk" x="22" y="42" width="4" height="8"/><rect class="m-leaf2" x="18" y="34" width="12" height="8"/><rect class="m-leaf2" x="20" y="30" width="8" height="6"/>';
  if(!AR) s+='<rect class="m-trunk" x="196" y="46" width="4" height="8"/><rect class="m-leaf2" x="192" y="38" width="12" height="8"/><rect class="m-leaf2" x="194" y="34" width="8" height="6"/>';
  s+='<rect class="m-track" x="0" y="100" width="220" height="14" fill="var(--track)"/>';
  s+=sprite(AR?80:110,104,false,act,sweat); // 有拱門時，娃娃站在左邊界與拱門的中間
  if(AR){ // 右側的終點拱門，橫樑上寫下一個課表的名稱（用短標籤，例如 Z2、輕鬆騎）
    var A=archParts(160,119,100,66,19,30,114,AR.style), lb=archLabel(AR.label,5), fs=Math.max(5,Math.min(8,Math.floor(A.t.w/lb.length)));
    A.r.forEach(function(q){s+='<rect x="'+q[0]+'" y="'+q[1]+'" width="'+q[2]+'" height="'+q[3]+'" fill="'+q[4]+'"/>'});
    s+='<text x="'+A.t.x+'" y="'+A.t.y+'" text-anchor="middle" font-size="'+fs+'" fill="'+A.t.c+'" style="font-family:var(--font-body)">'+esc(lb)+'</text>';
  }
  return s+'</svg>';
}
var h='<div class="hd"><h1>TODAY\'S QUEST</h1><div class="dt">'+(d.getMonth()+1)+'/'+d.getDate()+'（'+WD[d.getDay()]+'）</div></div>';
h+='<div class="scene">'+scene()+'</div>';
h+='<section class="sec"><h2>今天的課表</h2>';
if(w){
  h+='<div class="wk"><span class="kd">'+esc(w.kind)+'</span><span class="wt">'+esc(wlabel(w.title,w.kind))+'</span></div>';
  h+='<div class="meta">計畫 '+w.mins+' 分</div>';
  if(w.done){h+='<span class="st done">完成</span>'+(w.actual?'<div class="meta">實際 '+(w.actual.km?w.actual.km+' 公里・':'')+w.actual.min+' 分</div>':'')}
  else h+='<span class="st todo">還沒完成</span>';
}else h+='<div class="wt">今天休息</div>';
if(SNAP.extras&&SNAP.extras.length){h+='<div class="meta">另外完成：'+SNAP.extras.map(function(x){return esc(wlabel(x.title,x.kind))+(x.km?'（'+x.km+' 公里・'+x.min+' 分）':'')}).join('、')+'</div>'}
h+='</section>';
h+='<section class="sec"><h2>備賽進度</h2><div class="big">第 '+SNAP.weekNo+' 週 / '+SNAP.weeks+'</div>';
h+='<div class="meta">距離 '+esc(SNAP.race.name)+' 還有 '+days+' 天</div>';
h+='<div class="meta" style="margin-top:8px">本週完成 '+SNAP.week.done+' / '+SNAP.week.total+'</div><div class="pips" aria-hidden="true">';
for(var i=0;i<SNAP.week.total;i++) h+='<i class="'+(i<SNAP.week.done?'on':'')+'"></i>';
h+='</div></section>';
h+='<section class="sec"><h2>身體訊號</h2><div class="chips">';
[['rhr','靜息心率'],['hrv','HRV']].forEach(function(x){var s=SNAP.body[x[0]];h+='<div class="chip '+s+'"><i></i><span>'+x[1]+'<br>'+LBL[s]+'</span></div>'});
h+='</div><div class="legend">綠＝在自己設的範圍內　紅＝超出　白＝還沒資料。紅色時角色會流汗。</div></section>';
h+='<div class="ft"><span>Dino&#39;s Big Adventure</span><span>© '+new Date().getFullYear()+' dino.tw</span></div>';
document.getElementById('card').innerHTML=h;
})();
</script>
