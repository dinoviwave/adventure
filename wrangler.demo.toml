name = "adventure-demo"
main = "src/demo.js"
compatibility_date = "2026-01-01"
workers_dev = false   # 只用自訂網域；舊的 workers.dev 網址已關閉（2026-11-12）

[[routes]]
pattern = "quest.dino.tw"
custom_domain = true   # 展示版（公開，不要放在 Access 保護的範圍內）

[assets]
directory = "./public-demo"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "adventure"
database_id = "REPLACE_WITH_D1_ID"
